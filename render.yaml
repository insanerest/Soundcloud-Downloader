# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: soundcloud-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /

    envVars:
      - key: PORT
        value: "3009"
      - key: NODE_ENV
        value: production
      - key: SOUNDCLOUD_CLIENT_ID
        sync: false
