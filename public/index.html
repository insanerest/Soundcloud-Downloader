<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundCloud Studio</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="/hls.min.js"></script>
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Hero Section -->
      <header class="hero">
        <div class="logo-badge">🎵 SoundCloud Engine</div>
        <h1>Discover & Download</h1>
        <p>Search millions of tracks and remixes instantly.</p>

        <div class="search-bar-container">
          <input
            type="text"
            id="query"
            placeholder="Search tracks or remixes..."
            autocomplete="off"
          />
          <button onclick="search()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <span>Search</span>
          </button>
        </div>
      </header>

      <!-- Results Grid Container -->
      <main id="results" class="results-grid">
        <div class="empty-state">
          <div class="empty-icon">🎧</div>
          <h3>Ready when you are</h3>
          <p>Type something in the box above to start exploring tracks.</p>
        </div>
      </main>
    </div>

    <!-- Global Bottom Player -->
    <div id="bottom-player" class="bottom-player">
      <div class="player-info">
        <img id="player-img" src="/blur.png" alt="Track Cover" />
        <div class="player-text">
          <h4 id="player-title">No Track Selected</h4>
          <p id="player-artist">-</p>
        </div>
      </div>
      <div class="player-controls">
        <audio id="audio-player" controls controlsList="nodownload"></audio>
      </div>
      <button class="close-player" onclick="closePlayer()" title="Close Player">
        ✕
      </button>
    </div>

    <script>
      const inputEl = document.getElementById("query");
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const query = document.getElementById("query").value.trim();
          if (query) search();
        }
      });

      async function search() {
        const query = document.getElementById("query").value.trim();
        const resultsDiv = document.getElementById("results");

        if (!query) {
          resultsDiv.innerHTML = `
            <div class="empty-state error">
              <div class="empty-icon">⚠️</div>
              <h3>Input Required</h3>
              <p>Please enter a track name or artist to search.</p>
            </div>`;
          return;
        }

        resultsDiv.innerHTML = `
          <div class="loader-container">
            <div class="spinner"></div>
            <p>Scanning SoundCloud soundwaves...</p>
          </div>`;

        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();
          if (!res.ok) throw new Error("Search request failed.");

          if (!data.results || data.results.length === 0) {
            resultsDiv.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3>No Tracks Found</h3>
                <p class="no-results-query"></p>
              </div>`;
            resultsDiv.querySelector(".no-results-query").textContent =
              "We couldn't find anything matching \"" +
              query +
              '". Try another term.';
            return;
          }

          resultsDiv.innerHTML = "";

          for (const track of data.results) {
            let trackUrl;
            try {
              trackUrl = new URL(track.url);
              if (
                trackUrl.protocol !== "https:" ||
                !(
                  trackUrl.hostname === "soundcloud.com" ||
                  trackUrl.hostname.endsWith(".soundcloud.com")
                ) ||
                trackUrl.username ||
                trackUrl.password
              )
                continue;
            } catch {
              continue;
            }
            const title = String(track.title || "Untitled");
            const artist = String(track.username || "Unknown");
            let imageUrl = "/blur.png";
            try {
              const candidateImage = new URL(
                track.img || "/blur.png",
                window.location.origin,
              );
              if (
                candidateImage.protocol === "https:" ||
                candidateImage.origin === window.location.origin
              )
                imageUrl = candidateImage.href;
            } catch {}
            const card = document.createElement("div");
            card.className = "track-card";
            const imageWrapper = document.createElement("div");
            imageWrapper.className = "card-image-wrapper";
            const image = document.createElement("img");
            image.src = imageUrl;
            image.alt = title;
            image.loading = "lazy";
            imageWrapper.appendChild(image);
            const externalLink = document.createElement("a");
            externalLink.href = trackUrl.href;
            externalLink.target = "_blank";
            externalLink.rel = "noopener noreferrer";
            externalLink.className = "external-pill";
            externalLink.title = "View on SoundCloud";
            externalLink.setAttribute("aria-label", "View on SoundCloud");
            externalLink.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
            imageWrapper.appendChild(externalLink);
            card.appendChild(imageWrapper);
            const content = document.createElement("div");
            content.className = "card-content";
            const heading = document.createElement("h3");
            heading.textContent = title;
            heading.title = title;
            const artistText = document.createElement("p");
            artistText.className = "artist-name";
            artistText.textContent = artist;
            content.append(heading, artistText);
            const footer = document.createElement("div");
            footer.className = "card-footer";
            footer.style.display = "flex";
            footer.style.gap = "8px";
            const streamButton = document.createElement("button");
            streamButton.type = "button";
            streamButton.className = "action-btn";
            streamButton.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg><span>Stream</span>';
            streamButton.addEventListener("click", () =>
              playStream(trackUrl.href, title, artist, imageUrl),
            );
            const downloadLink = document.createElement("a");
            downloadLink.className = "action-btn";
            downloadLink.style.textDecoration = "none";
            downloadLink.style.display = "inline-flex";
            downloadLink.style.alignItems = "center";
            downloadLink.style.justifyContent = "center";
            downloadLink.style.gap = "6px";
            downloadLink.href =
              "/api/download?url=" +
              encodeURIComponent(trackUrl.href) +
              "&name=" +
              encodeURIComponent(title) +
              "&download=1";
            downloadLink.download =
              title.replace(/[\/\\?%*:|"< >\x00-\x1f\x7f]/g, "_") + ".mp3";
            downloadLink.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span>Download</span>';
            footer.append(streamButton, downloadLink);
            content.appendChild(footer);
            card.appendChild(content);
            resultsDiv.appendChild(card);
          }
        } catch (err) {
          console.error(err);
          resultsDiv.innerHTML = `
            <div class="empty-state error">
              <div class="empty-icon">❌</div>
              <h3>Connection Error</h3>
              <p>Failed to fetch results from the server. Please try again.</p>
            </div>`;
        }
      }

      let currentHls = null;

      async function playStream(trackUrl, title, artist, img) {
        const player = document.getElementById("bottom-player");
        const audioEl = document.getElementById("audio-player");

        document.getElementById("player-img").src = img;
        document.getElementById("player-title").textContent = title;
        document.getElementById("player-artist").textContent = artist;
        player.classList.add("show");

        // Destroy any active HLS stream instance before switching
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
        audioEl.pause();
        audioEl.removeAttribute("src");
        audioEl.load();

        try {
          const res = await fetch(
            `/api/stream-info?url=${encodeURIComponent(trackUrl)}&name=${encodeURIComponent(title)}`,
          );
          const data = await res.json();
          if (data.error) throw new Error(data.error);

          const streamUrl = data.streamUrl;
          const isHls = data.type === "hls";
          const resolvedUrl = new URL(streamUrl);
          if (
            resolvedUrl.protocol !== "https:" ||
            !(
              resolvedUrl.hostname === "soundcloud.com" ||
              resolvedUrl.hostname.endsWith(".soundcloud.com") ||
              resolvedUrl.hostname === "sndcdn.com" ||
              resolvedUrl.hostname.endsWith(".sndcdn.com")
            )
          ) {
            throw new Error("Rejected unexpected stream host.");
          }

          if (isHls && !audioEl.canPlayType("application/vnd.apple.mpegurl")) {
            // Use HLS.js for browsers without native HLS (Chrome, Edge, Firefox)
            if (typeof Hls !== "undefined" && Hls.isSupported()) {
              const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 60,
              });
              currentHls = hls;
              hls.loadSource(streamUrl);
              hls.attachMedia(audioEl);
              hls.on(Hls.Events.MANIFEST_PARSED, () => {
                audioEl
                  .play()
                  .catch((e) => console.error("Playback prevented:", e));
              });
              hls.on(Hls.Events.ERROR, (event, errData) => {
                if (errData.fatal) {
                  console.warn(
                    "HLS fatal error, falling back to server stream proxy:",
                    errData,
                  );
                  hls.destroy();
                  currentHls = null;
                  audioEl.src = `/api/download?url=${encodeURIComponent(trackUrl)}&name=${encodeURIComponent(title)}`;
                  audioEl
                    .play()
                    .catch((e) => console.error("Fallback play error:", e));
                }
              });
              return;
            }
          }

          // Native playback (Safari HLS, progressive MP3, or local cached MP3)
          audioEl.src = streamUrl;
          audioEl.play().catch((e) => console.error("Playback prevented:", e));
        } catch (err) {
          console.warn(
            "Stream info failed, falling back to server proxy:",
            err,
          );
          audioEl.src = `/api/download?url=${encodeURIComponent(trackUrl)}&name=${encodeURIComponent(title)}`;
          audioEl.play().catch((e) => console.error("Fallback play error:", e));
        }
      }

      function closePlayer() {
        const player = document.getElementById("bottom-player");
        const audioEl = document.getElementById("audio-player");
        player.classList.remove("show");
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
        audioEl.pause();
        audioEl.removeAttribute("src");
        audioEl.load();
      }
    </script>
  </body>
</html>
